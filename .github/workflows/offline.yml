name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - run: python -m unittest discover -s tests -v
      - run: python3.14 -m evals run --out "$RUNNER_TEMP/newsdesk-ai-evals"
      - run: python scripts/check_public.py
      - run: python -m newsdesk demo --out outputs/ci-article
      - run: python -m newsdesk.digest demo --out outputs/ci-daily
      - run: python -m newsdesk.daily --state outputs/ci-state init
      - run: python -m newsdesk.daily --state outputs/ci-state build --current-window
